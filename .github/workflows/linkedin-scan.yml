# ==========================================================================
# LinkedIn Job Scan - PUBLIC RUNNER workflow
#
# This file lives in the PUBLIC repo. It contains NO secrets and NO code.
# It clones your PRIVATE code repo (linkedin-job-miner) with CODE_PAT and
# runs it there. Public repo = unlimited free Actions minutes; the code,
# prompts and logic never leave the private repo.
#
# Secrets needed (set once in THIS repo):
#   CODE_PAT          - classic PAT with repo scope (reads the private repo)
#   LINKEDIN_CODE_REPO- e.g.  your-new-username/linkedin-job-miner
#   + all the miner secrets (GOOGLE_SA_JSON, GMAIL_APP_PASSWORD, AI_API_KEY_1...)
#
# Logs stay clean on success (output is captured, not printed - this is a
# PUBLIC log). On failure the last 30 lines are shown for debugging, and the
# SYSTEM ERROR email still goes out (mailer.py sends it from inside main.py).
# ==========================================================================
name: LinkedIn Job Scan

on:
  schedule:
    # Every 4 hours = 6 runs/day (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # IST: 05:30, 09:30, 13:30, 17:30, 21:30, 01:30
    - cron: "0 */4 * * *"
    # Friday 06:30 UTC = 12:00 PM IST -> weekly summary email (weekly.py)
    - cron: "30 6 * * 5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual testing

permissions:
  contents: write         # keepalive step commits .last-run to THIS public repo

concurrency:
  group: linkedin-miner
  cancel-in-progress: false   # never overlap runs; queue instead

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4   # checks out THIS public (runner) repo

      - name: Pull private code repo
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.CODE_PAT }}@github.com/${{ secrets.LINKEDIN_CODE_REPO }}.git" app
          ls -la app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run job lead miner (output captured - this is a public log)
        env:
          # --- pipeline config ---
          ICP_DESCRIPTION: ${{ secrets.ICP_DESCRIPTION }}
          MIN_SCORE: ${{ secrets.MIN_SCORE }}
          MAX_LEADS_PER_RUN: ${{ secrets.MAX_LEADS_PER_RUN }}
          CANDIDATE_CAP: ${{ secrets.CANDIDATE_CAP }}
          # --- keywords (rotate every run) ---
          KEYWORDS: ${{ secrets.KEYWORDS }}
          KEYWORDS_PER_RUN: ${{ secrets.KEYWORDS_PER_RUN }}
          # run number seeds the rotation: every run draws a DIFFERENT combo
          KEYWORD_RUN_NUMBER: ${{ github.run_number }}
          LINKEDIN_PAGES_PER_KW: ${{ secrets.LINKEDIN_PAGES_PER_KW }}
          JOB_MAX_AGE_DAYS: ${{ secrets.JOB_MAX_AGE_DAYS }}
          # --- enrichment knobs ---
          DESC_LIMIT_PER_RUN: ${{ secrets.DESC_LIMIT_PER_RUN }}
          ENRICH_COMPANY: ${{ secrets.ENRICH_COMPANY }}
          COMPANY_LIMIT_PER_RUN: ${{ secrets.COMPANY_LIMIT_PER_RUN }}
          COMPANY_ENRICH_WORKERS: ${{ secrets.COMPANY_ENRICH_WORKERS || 8 }}
          SCRAPE_DEADLINE_MIN: ${{ secrets.SCRAPE_DEADLINE_MIN || 14 }}
          # --- bot-wall auto-recovery: FREE public proxy rotation ---
          LINKEDIN_PROXY_MODE: ${{ secrets.LINKEDIN_PROXY_MODE }}
          PROXY_VALIDATE_LIMIT: ${{ secrets.PROXY_VALIDATE_LIMIT }}
          PROXY_VALIDATE_WORKERS: ${{ secrets.PROXY_VALIDATE_WORKERS }}
          PROXY_POOL_MAX: ${{ secrets.PROXY_POOL_MAX || 120 }}
          PROXY_TIMEOUT: ${{ secrets.PROXY_TIMEOUT }}
          PROXY_MAX_BUILDS_PER_RUN: ${{ secrets.PROXY_MAX_BUILDS_PER_RUN || 6 }}
          PROXY_MAX_TRIES_PER_PAGE: ${{ secrets.PROXY_MAX_TRIES_PER_PAGE || 8 }}
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # --- google sheets ---
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          UNQUALIFIED_SHEET_NAME: ${{ secrets.UNQUALIFIED_SHEET_NAME }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          # --- AI (groq) - one batch per key fired in parallel each round ---
          AI_API_KEY_1: ${{ secrets.AI_API_KEY_1 }}
          AI_API_KEY_2: ${{ secrets.AI_API_KEY_2 }}
          AI_API_KEY_3: ${{ secrets.AI_API_KEY_3 }}
          AI_API_KEY_4: ${{ secrets.AI_API_KEY_4 }}
          AI_API_KEY_5: ${{ secrets.AI_API_KEY_5 }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BATCH_SIZE: ${{ secrets.AI_BATCH_SIZE }}
          AI_ROUND_PAUSE_SEC: ${{ secrets.AI_ROUND_PAUSE_SEC || 15 }}
          AI_MAX_ATTEMPTS: ${{ secrets.AI_MAX_ATTEMPTS }}
          AI_DEADLINE_MIN: ${{ secrets.AI_DEADLINE_MIN }}
          AI_REASONING_EFFORT: ${{ secrets.AI_REASONING_EFFORT }}
          # --- optional sources / escape hatches ---
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # --- email run reports (3 threads: qualified / weekly / errors) ---
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || secrets.EMAIL_TO || '' }}
          MAIL_CC: ${{ secrets.MAIL_CC || secrets.EMAIL_CC || '' }}
        run: |
          cd app
          set +e
          if [ "${{ github.event.schedule }}" = "30 6 * * 5" ]; then
            python weekly.py  > /tmp/run_output.log 2>&1
          else
            python main.py scan > /tmp/run_output.log 2>&1
          fi
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== RUN FAILED - last 30 log lines ==="
            tail -n 30 /tmp/run_output.log
          else
            echo "Run finished OK. Details went to your Gmail (3-thread reports)."
          fi
          exit $code

      - name: Keepalive (stops GitHub's 60-day cron auto-disable)
        if: always()
        run: |
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git add .last-run
          git diff --cached --quiet || git commit -m "keepalive $(date -u +%F)"
          git pull --rebase || true
          git push || true
